name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Buf lint
        run: go run github.com/bufbuild/buf/cmd/buf@latest lint
      - name: Buf generate (check drift)
        run: |
          go run github.com/bufbuild/buf/cmd/buf@latest generate
          git diff --exit-code
