name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Buf lint
        run: go run github.com/bufbuild/buf/cmd/buf@latest lint
      - name: Buf generate (check drift)
        run: |
          go run github.com/bufbuild/buf/cmd/buf@latest generate
          git diff --exit-code

  docker:
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_SERVER: ${{ github.repository }}-server
      IMAGE_MCP: ${{ github.repository }}-mcp
      SHOULD_PUSH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (server)
        id: meta_server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_SERVER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
            type=sha

      - name: Docker metadata (mcp)
        id: meta_mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_MCP }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: ${{ steps.meta_mcp.outputs.tags }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  npm-client:
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required when NODE_AUTH_TOKEN is GITHUB_TOKEN (same-repo publish to GPR). PAT path uses PUBLISH_TOKEN only.
      packages: write
    env:
      SHOULD_PUSH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@bednaz98"

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prerelease version for publish
        if: env.SHOULD_PUSH == 'true'
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.version=p.version+'-main.'+process.env.GITHUB_RUN_ID+'.'+process.env.GITHUB_RUN_ATTEMPT;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      # Auth: non-empty PUBLISH_TOKEN (PAT) else GITHUB_TOKEN. E401 = empty/bad PAT or SSO; omit PUBLISH_TOKEN to use GITHUB_TOKEN.
      - name: Publish to GitHub Packages
        if: env.SHOULD_PUSH == 'true'
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_TOKEN != '' && secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
